readme = "README.md"
authors = [
    { name = "kxianggen", email = "xianggen13@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
